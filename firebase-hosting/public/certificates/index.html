<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JetLearn — My Certificates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --navy:#1a1560; --navy-deep:#100c3f; --navy-mid:#2a2180;
      --cream:#fff9ec; --paper:#fffdf7;
      --yellow:#f5c400; --yellow-soft:#ffe27a; --orange:#f97316;
      --mint:#1fb87a; --mint-soft:#e3f8ee;
      --ink:#241e63; --ink-soft:#6b6596; --line:#eee6cf;
      --shadow: 0 18px 40px -18px rgba(26,21,96,0.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--cream); color: var(--ink); overflow-x: hidden; position: relative;
    }

    /* ── Graph paper + doodle backdrop ─────────────────────────────────── */
    .paper-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(26,21,96,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,21,96,0.045) 1px, transparent 1px);
      background-size: 34px 34px; background-color: var(--cream);
    }
    .doodle { position: fixed; z-index: 0; pointer-events: none; opacity: 0.16; color: var(--navy); }
    .doodle svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .d1 { top: 8%; left: 3%; width: 72px; animation: drift 9s ease-in-out infinite; }
    .d2 { top: 64%; left: 4%; width: 68px; color: var(--orange); animation: drift 11s ease-in-out infinite 1s; }
    .d3 { top: 18%; right: 4%; width: 78px; animation: driftRotate 13s ease-in-out infinite; }
    .d4 { top: 76%; right: 6%; width: 64px; color: var(--orange); animation: drift 10s ease-in-out infinite .6s; }
    .d5 { top: 40%; left: 1.5%; width: 36px; animation: twinkle 4s ease-in-out infinite; }
    .d6 { top: 10%; right: 20%; width: 30px; animation: twinkle 5s ease-in-out infinite 1.3s; }
    .d7 { top: 92%; left: 26%; width: 34px; animation: twinkle 4.6s ease-in-out infinite .8s; }
    .d8 { top: 50%; right: 2%; width: 66px; color: var(--orange); animation: drift 12s ease-in-out infinite 2s; }
    .d9 { top: 29%; left: 5.5%; width: 60px; animation: driftRotate 14s ease-in-out infinite .4s; }
    .d10 { top: 60%; right: 16%; width: 58px; color: var(--orange); animation: drift 9.5s ease-in-out infinite 1.4s; }
    @keyframes drift { 0%,100%{ transform: translateY(0) rotate(-3deg); } 50%{ transform: translateY(-16px) rotate(3deg); } }
    @keyframes driftRotate { 0%,100%{ transform: translateY(0) rotate(6deg); } 50%{ transform: translateY(-12px) rotate(-6deg); } }
    @keyframes twinkle { 0%,100%{ opacity:.10; transform:scale(.9); } 50%{ opacity:.35; transform:scale(1.15); } }
    @media (max-width: 900px) { .doodle { display: none; } }

    .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 0 60px; }

    /* ── Hero ─────────────────────────────────────────────────────────── */
    .hero {
      background: radial-gradient(120% 160% at 15% 0%, var(--navy-mid) 0%, var(--navy) 45%, var(--navy-deep) 100%);
      border-radius: 0 0 40px 40px; padding: 30px 24px 90px; text-align: center; color: #fff;
      position: relative; overflow: hidden;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: 0.35; pointer-events: none; }
    .orb1 { width: 220px; height: 220px; background: radial-gradient(circle,#ff8a5c,transparent 70%); top: -90px; right: -70px; animation: orbFloat 8s ease-in-out infinite; }
    .orb2 { width: 160px; height: 160px; background: radial-gradient(circle,#7c74e0,transparent 70%); bottom: -60px; left: -50px; animation: orbFloat 10s ease-in-out infinite 1s; }
    @keyframes orbFloat { 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(10px,-14px); } }
    .hero::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      background: linear-gradient(90deg,var(--yellow),var(--orange),var(--yellow)); background-size: 200% 100%;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% 0; } }

    .brandline { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 24px; position: relative; z-index: 1; }
    .brandline img { width: 28px; height: 28px; border-radius: 50%; background: #fff; padding: 3px; }
    .brandline span { text-align: left; line-height: 1.25; font-size: 11px; font-weight: 700; opacity: .92; }

    .badge-medal { width: 84px; height: 84px; margin: 0 auto 16px; position: relative; z-index: 1; }
    .badge-medal svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 22px rgba(245,196,0,0.45)); }

    .hero h1 { font-family: 'Baloo 2'; font-weight: 800; font-size: clamp(26px,5vw,38px); margin: 0 0 10px; position: relative; z-index: 1; }
    .hero p.sub { max-width: 440px; margin: 0 auto 24px; color: #d9d6ff; font-size: 14.5px; line-height: 1.55; position: relative; z-index: 1; }

    .stat-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 1; }
    .stat-pill {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px); border-radius: 16px; padding: 11px 17px; min-width: 88px;
      transition: transform .25s ease;
    }
    .stat-pill:hover { transform: translateY(-4px); }
    .stat-pill b { display: block; font-family: 'Baloo 2'; font-size: 20px; }
    .stat-pill span { font-size: 9.5px; letter-spacing: .5px; font-weight: 700; color: #c9c6ee; text-transform: uppercase; }

    .content { padding: 0 20px; margin-top: -58px; position: relative; z-index: 2; }

    .shelf-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 16px; }
    .shelf-head h2 { font-family: 'Baloo 2'; font-size: 18px; color: var(--navy); margin: 0; }
    .shelf-head span { font-size: 12px; color: var(--ink-soft); font-weight: 600; }

    /* ── Certificate cards ────────────────────────────────────────────── */
    .cert-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
      padding: 20px 20px 16px; margin-bottom: 18px; position: relative; box-shadow: var(--shadow);
      overflow: hidden; opacity: 0; transform: translateY(18px) scale(0.98);
      animation: cardIn .6s ease forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    .cert-card::before {
      content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      transform: skewX(-18deg); transition: left .6s ease; pointer-events: none;
    }
    .cert-card:hover::before { left: 130%; }
    .cert-card:hover { transform: translateY(-4px) rotate(-0.3deg); }
    .cert-card .ribbon {
      position: absolute; top: -3px; right: 22px; width: 0; height: 0;
      border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 24px solid var(--orange);
    }
    .medallion {
      width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg,var(--yellow-soft),var(--yellow)); margin-bottom: 10px;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08); font-size: 1.15rem; color: var(--navy);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800;
      letter-spacing: .4px; text-transform: uppercase; padding: 3px 9px; border-radius: 99px;
      margin-bottom: 7px; background: var(--mint-soft); color: var(--mint);
    }
    .cert-card h3 { font-family: 'Baloo 2'; font-size: 16px; margin: 0 0 4px; color: var(--navy); line-height: 1.3; }
    .cert-card .date { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--ink-soft); margin-bottom: 14px; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 12px; padding: 9px 15px; font-weight: 700; font-size: 12.5px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: 'Plus Jakarta Sans';
      transition: transform .15s ease, box-shadow .15s ease; text-decoration: none; white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { box-shadow: 0 8px 18px -6px rgba(26,21,96,0.55); }
    .btn-secondary { background: #f1efff; color: var(--navy); }
    .btn-secondary:hover { background: #e6e2ff; }

    .cert-preview { margin-top: 14px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line); background: #f6f3ff; }
    .cert-preview iframe { width: 100%; height: 440px; border: 0; display: block; }

    .share-row { display: flex; align-items: center; gap: 8px; padding-top: 12px; margin-top: 12px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
    .share-row .lbl { font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-right: 2px; }
    .share-icon {
      width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12.5px; cursor: pointer; transition: transform .15s ease; border: none; text-decoration: none;
    }
    .share-icon:hover { transform: translateY(-2px); }
    .s-linkedin { background: #0A66C2; } .s-whatsapp { background: #25D366; }
    .s-x { background: #000; } .s-facebook { background: #1877F2; } .s-copy { background: #6b6596; }
    .copy-toast { font-size: 11px; color: var(--mint); font-weight: 700; margin-left: 4px; opacity: 0; transition: opacity .2s; }
    .copy-toast.show { opacity: 1; }

    .verify-line { font-family: 'JetBrains Mono'; font-size: 9.5px; color: var(--ink-soft); border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 9px; }
    .verify-line b { color: var(--navy); }

    .state-msg { text-align: center; padding: 60px 24px; position: relative; z-index: 1; }
    .state-msg .icon-wrap { width: 66px; height: 66px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 1.55rem; }
    .state-msg.error .icon-wrap { background: #fef2f2; color: #ef4444; }
    .state-msg h2 { font-family: 'Baloo 2'; font-size: 1.2rem; margin: 0 0 8px; color: var(--navy); }
    .state-msg p { font-size: .88rem; color: var(--ink-soft); margin: 0; line-height: 1.55; }

    #loadingState { text-align: center; padding: 100px 24px; color: var(--ink-soft); position: relative; z-index: 1; }
    #loadingState .spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 28px; font-size: 13px; color: var(--ink-soft); padding: 0 20px; }
    .footer a { color: #fff; background: #25D366; text-decoration: none; font-weight: 700; padding: 7px 13px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }

    #confettiCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

    @keyframes trophyPop {
      0% { transform: scale(0.4) rotate(-14deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .badge-medal.pop { animation: trophyPop .7s cubic-bezier(.21,1.2,.4,1) forwards; }

    @media (prefers-reduced-motion: reduce) {
      *{ animation: none !important; transition: none !important; }
      .cert-card{ opacity: 1 !important; transform: none !important; }
      .doodle{ display: none !important; }
    }
  </style>
</head>

    <div class="icon-wrap"><i class="fas fa-triangle-exclamation"></i></div>

    <p id="errorMsg">This link appears to be invalid or has expired. Please contact JetLearn support.</p>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzYXnVGNxTclM0Z6qrCuNUwkHDxRZzGqgfsf55tmGegZ_vxUhaL08T3k0MXnz2cM0hVOA/exec';

    var pathParts = location.pathname.split('/certificates/');
    var JLID = decodeURIComponent((pathParts[1] || '').replace(/\/$/, '')).trim().toUpperCase();

    function showState(id) {
      ['loadingState', 'certState', 'errorState'].forEach(function(s) {
        document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
      });
    }

    function esc(s) { return String(s || '').replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // Google Drive "view" links (…/file/d/{ID}/view) can be embedded inline
    // via the …/preview variant, and downloaded directly via uc?export=download.
    function driveFileId(url) {
      var m = String(url || '').match(/\/file\/d\/([^/]+)/);
      return m ? m[1] : '';
    }
    function drivePreviewUrl(url) {
      var id = driveFileId(url);
      return id ? 'https://drive.google.com/file/d/' + id + '/preview' : url;
    }
    function driveDownloadUrl(url) {
      var id = driveFileId(url);
      return id ? 'https://drive.google.com/uc?export=download&id=' + id : url;
    }

    function togglePreview(idx) {
      var el = document.getElementById('preview-' + idx);
      var btn = document.getElementById('viewbtn-' + idx);
      if (!el) return;
      var opening = el.style.display === 'none';
      el.style.display = opening ? 'block' : 'none';
      if (opening && !el.dataset.loaded) {
        el.innerHTML = '<iframe src="' + el.dataset.src + '" allow="autoplay"></iframe>';
        el.dataset.loaded = '1';
      }
      if (btn) btn.innerHTML = opening ? '<i class="fas fa-eye-slash"></i> Hide' : '<i class="fas fa-eye"></i> View';
    }

    function copyLink(idx, url) {
      navigator.clipboard.writeText(url).then(function() {
        var t = document.getElementById('copytoast-' + idx);
        if (t) { t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 1800); }
      });
    }

    // Lightweight confetti burst — no external library.
    function fireConfetti() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var canvas = document.getElementById('confettiCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var colors = ['#f5c400', '#f97316', '#7c74e0', '#1fb87a', '#0A66C2', '#ef4444'];
      var count = window.innerWidth < 480 ? 80 : 140;
      var particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * window.innerWidth, y: -20 - Math.random() * window.innerHeight * 0.4,
          w: 6 + Math.random() * 5, h: 8 + Math.random() * 6, color: colors[i % colors.length],
          vy: 2.2 + Math.random() * 2.6, vx: -1.2 + Math.random() * 2.4,
          rot: Math.random() * 360, vr: -8 + Math.random() * 16
        });
      }
      var start = Date.now(), duration = 2800;
      function frame() {
        var elapsed = Date.now() - start;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        var fade = elapsed > duration - 500 ? Math.max(0, (duration - elapsed) / 500) : 1;
        particles.forEach(function(p) {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        });
        if (elapsed < duration) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
      requestAnimationFrame(frame);
    }

    (function() {
      if (!JLID) {
        document.getElementById('errorMsg').textContent = 'This link is missing learner information. Please contact JetLearn support.';
        showState('errorState');
        return;
      }
      fetch(GAS_URL + '?api=myCertificates&jlid=' + encodeURIComponent(JLID))
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (!res || !res.success || !res.certificates || !res.certificates.length) {
            document.getElementById('errorMsg').textContent = (res && res.message) || 'No certificates found for this link.';
            showState('errorState');
            return;
          }
          var first = (res.learnerName || '').split(' ')[0] || 'there';
          var n = res.certificates.length;
          document.getElementById('heroTitle').textContent = first + '’s Achievement Wall';
          document.getElementById('heroSub').textContent = 'Every certificate ' + first + ' has earned at JetLearn — proud of every milestone, and excited for what’s next!';
          document.getElementById('shelfCount').textContent = n + ' certificate' + (n > 1 ? 's' : '') + ' earned';

          var years = {};
          res.certificates.forEach(function(c) { if (c.year) years[c.year] = true; });
          document.getElementById('statRow').innerHTML =
              '<div class="stat-pill"><b>' + n + '</b><span>Certificate' + (n > 1 ? 's' : '') + '</span></div>'
            + '<div class="stat-pill"><b>' + Object.keys(years).length + '</b><span>Year' + (Object.keys(years).length > 1 ? 's' : '') + '</span></div>'
            + '<div class="stat-pill"><b>🌟</b><span>Star Learner</span></div>';

          var html = res.certificates.map(function(c, idx) {
            var hasFile = !!c.driveUrl;
            var previewUrl = hasFile ? drivePreviewUrl(c.driveUrl) : '';
            var downloadUrl = hasFile ? driveDownloadUrl(c.driveUrl) : '';

            var postText = 'I’m glad to inform that I’ve completed my certification in "' + c.course + '" with JetLearn! 🎉🚀 #JetLearn #STEM #Coding #LearningJourney';
            var shareUrl = c.driveUrl || ('https://jetlearn-kit-links.web.app/certificates/' + encodeURIComponent(res.jlid));

            var actions = hasFile
              ? '<div class="btn-row">'
                + '<button class="btn btn-primary" id="viewbtn-' + idx + '" onclick="togglePreview(' + idx + ')"><i class="fas fa-eye"></i> View</button>'
                + '<a class="btn btn-secondary" href="' + esc(downloadUrl) + '" target="_blank"><i class="fas fa-download"></i> Download</a>'
                + '</div>'
              : '';

            var preview = hasFile
              ? '<div class="cert-preview" id="preview-' + idx + '" data-src="' + esc(previewUrl) + '" style="display:none;"></div>'
              : '';

            var shareRow = '<div class="share-row">'
              + '<span class="lbl">Share:</span>'
              + '<a class="share-icon s-linkedin" title="LinkedIn" target="_blank" href="https://www.linkedin.com/shareArticle?mini=true&url=' + encodeURIComponent(shareUrl) + '&title=' + encodeURIComponent('Certificate: ' + c.course) + '&summary=' + encodeURIComponent(postText) + '"><i class="fab fa-linkedin-in"></i></a>'
              + '<a class="share-icon s-whatsapp" title="WhatsApp" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(postText + ' ' + shareUrl) + '"><i class="fab fa-whatsapp"></i></a>'
              + '<a class="share-icon s-x" title="X" target="_blank" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(postText) + '&url=' + encodeURIComponent(shareUrl) + '"><i class="fab fa-x-twitter"></i></a>'
              + '<a class="share-icon s-facebook" title="Facebook" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '"><i class="fab fa-facebook-f"></i></a>'
              + '<button class="share-icon s-copy" title="Copy link" onclick="copyLink(' + idx + ',\'' + shareUrl.replace(/'/g, "\\'") + '\')"><i class="fas fa-link"></i></button>'
              + '<span class="copy-toast" id="copytoast-' + idx + '">Copied!</span>'
              + '</div>';

            var verify = res.jlid ? '<div class="verify-line">Learner Ref · <b>' + esc(res.jlid) + '</b></div>' : '';

            return '<div class="cert-card" style="animation-delay:' + (0.1 + idx * 0.16).toFixed(2) + 's;">'
              + '<div class="ribbon"></div>'
              + '<div class="medallion"><i class="fas fa-award"></i></div>'
              + '<div class="pill">Completed</div>'
              + '<h3>' + esc(c.course) + '</h3>'
              + '<div class="date">Awarded · ' + esc(c.timestamp || c.year) + '</div>'
              + actions
              + preview
              + shareRow
              + verify
              + '</div>';
          }).join('');
          document.getElementById('certList').innerHTML = html;

          showState('certState');
          document.getElementById('badgeMedal').classList.add('pop');
          fireConfetti();
        })
        .catch(function(err) {
          document.getElementById('errorMsg').textContent = String((err && err.message) || err);
          showState('errorState');
        });
    })();
  </script>
</body>
</html>
