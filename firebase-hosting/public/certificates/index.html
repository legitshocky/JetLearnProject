<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JetLearn — My Certificates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ink: #1b1e3d; --muted: #6b7280; --yellow: #ffc700; --purple: #7c3aed; --purple-dark: #6d28d9;
      --line: #e5e7eb; --field-bg: #fafafa; --page-bg: #f7f6fb; --green: #16a34a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg); color: var(--ink); min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 0 60px; }

    /* ── Hero ─────────────────────────────────────────────────────────── */
    .hero {
      position: relative; overflow: hidden;
      background: radial-gradient(120% 140% at 15% -10%, #9a6bff 0%, #7c3aed 42%, #4c1d95 100%);
      padding: 28px 24px 96px; color: #fff; text-align: center;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(1px);
    }
    .hero::before { width: 180px; height: 180px; background: #ffc700; top: -70px; right: -50px; opacity: 0.35; }
    .hero::after { width: 130px; height: 130px; background: #34d399; bottom: -50px; left: -40px; opacity: 0.25; }
    .hero-brand { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 26px; position: relative; z-index: 1; }
    .hero-brand img { height: 30px; display: block; filter: brightness(0) invert(1); }
    .hero-brand .tag { font-size: 0.65rem; color: rgba(255,255,255,0.75); text-align: left; line-height: 1.25; max-width: 150px; }

    .trophy-badge {
      width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 24px; position: relative; z-index: 1;
      background: linear-gradient(155deg, #ffe066, #ffc700); display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #7a5c00; box-shadow: 0 10px 30px rgba(255,199,0,0.4);
    }
    .hero h1 { font-size: clamp(1.55rem, 4vw, 2.15rem); font-weight: 800; line-height: 1.2; margin: 0 0 8px; position: relative; z-index: 1; }
    .hero .sub { font-size: 0.92rem; color: rgba(255,255,255,0.82); line-height: 1.6; margin: 0 auto; max-width: 420px; position: relative; z-index: 1; }

    .stat-row { display: flex; justify-content: center; gap: 12px; margin-top: 22px; position: relative; z-index: 1; flex-wrap: wrap; }
    .stat-pill {
      background: rgba(255,255,255,0.14); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px; padding: 10px 18px; min-width: 84px;
    }
    .stat-pill b { display: block; font-size: 1.35rem; font-weight: 800; line-height: 1; }
    .stat-pill span { display: block; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.75); margin-top: 4px; }

    /* Card stack pulled up over the hero's rounded bottom edge */
    .content { padding: 0 20px; margin-top: -68px; position: relative; z-index: 2; }

    /* ── Certificate cards ────────────────────────────────────────────── */
    .cert-card {
      background: #fff; border-radius: 18px; padding: 4px; margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(76,29,149,0.1); overflow: hidden;
    }
    .cert-card-inner { padding: 18px 18px 16px; }
    .cert-accent { height: 5px; background: linear-gradient(90deg, #7c3aed, #ffc700); border-radius: 18px 18px 0 0; }
    .cert-top { display: flex; align-items: flex-start; gap: 14px; }
    .cert-icon {
      flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(155deg, #fff4cc, #ffe066); color: #7a5c00;
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(255,199,0,0.25);
    }
    .cert-info { flex: 1 1 auto; min-width: 0; padding-top: 2px; }
    .cert-info .badge {
      display: inline-block; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #6d28d9; background: #f3ecff; border-radius: 99px; padding: 2px 9px; margin-bottom: 5px;
    }
    .cert-info b { display: block; font-size: 1rem; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
    .cert-info span { font-size: 0.76rem; color: var(--muted); }

    .cert-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-sm {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none;
      padding: 9px 15px; font-size: 0.78rem; font-weight: 700; border-radius: 99px; white-space: nowrap;
      font-family: inherit; text-decoration: none;
    }
    .btn-view { color: #fff; background: var(--purple); box-shadow: 0 4px 12px rgba(124,58,237,0.28); }
    .btn-view:hover { background: var(--purple-dark); }
    .btn-download { color: var(--purple); background: #f3ecff; border: 1.5px solid transparent; }
    .btn-download:hover { background: #ece1ff; }

    .cert-preview {
      margin-top: 16px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line);
      background: var(--field-bg);
    }
    .cert-preview iframe { width: 100%; height: 440px; border: 0; display: block; }

    .share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .share-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-right: 2px; }
    .share-btn {
      width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none; font-size: 0.85rem; border: none; cursor: pointer; font-family: inherit;
      transition: transform 0.12s;
    }
    .share-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .share-linkedin { background: #0a66c2; }
    .share-whatsapp { background: #25d366; }
    .share-x { background: #000; }
    .share-facebook { background: #1877f2; }
    .share-copy { background: #6b7280; }
    .copy-toast { font-size: 0.72rem; color: var(--green); font-weight: 600; margin-left: 4px; opacity: 0; transition: opacity 0.2s; }
    .copy-toast.show { opacity: 1; }

    .state-msg { text-align: center; padding: 60px 24px; }
    .state-msg .icon-wrap {
      width: 66px; height: 66px; border-radius: 50%; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center; font-size: 1.55rem;
    }
    .state-msg.error .icon-wrap { background: #fef2f2; color: #ef4444; }
    .state-msg h2 { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
    .state-msg p { font-size: 0.88rem; color: var(--muted); margin: 0; line-height: 1.55; }

    #loadingState { text-align: center; padding: 100px 24px; color: #9ca3af; }
    #loadingState .spinner {
      width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--purple);
      border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .foot { text-align: center; padding: 30px 20px 10px; color: #9ca3af; font-size: 0.75rem; }
    .foot a { color: #6b7280; text-decoration: none; }

    #confettiCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

    @keyframes revealUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { opacity: 0; animation: revealUp 0.6s cubic-bezier(.21,.9,.4,1) forwards; }

    @keyframes trophyPop {
      0% { transform: scale(0.4) rotate(-14deg); opacity: 0; }
      60% { transform: scale(1.12) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .trophy-badge.reveal { animation: trophyPop 0.7s cubic-bezier(.21,1.2,.4,1) forwards; }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div id="loadingState"><div class="spinner"></div>Loading your certificates…</div>

  <div id="certState" style="display:none;">
    <div class="hero">
      <div class="hero-brand">
        <img src="https://cdn.jsdelivr.net/gh/legitshocky/Jet-learn-Images@main/Logo.png" alt="JetLearn">
        <div class="tag">Holistic Online STEM Education for Children</div>
      </div>
      <div class="trophy-badge reveal" style="animation-delay:.02s;"><i class="fas fa-trophy"></i></div>
      <h1 id="heroTitle" class="reveal" style="animation-delay:.1s;">My certificates</h1>
      <p class="sub reveal" id="heroSub" style="animation-delay:.17s;">Every course completion certificate, in one place.</p>
      <div class="stat-row reveal" id="statRow" style="animation-delay:.24s;"></div>
    </div>

    <div class="wrap">
      <div class="content">
        <div id="certList"></div>
      </div>
      <div class="foot">Questions? <a href="https://wa.me/447401469536">Message us on WhatsApp</a></div>
    </div>
  </div>

  <div id="errorState" class="state-msg error" style="display:none;">
    <div class="icon-wrap"><i class="fas fa-triangle-exclamation"></i></div>
    <h2>Link Not Valid</h2>
    <p id="errorMsg">This link appears to be invalid or has expired. Please contact JetLearn support.</p>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzYXnVGNxTclM0Z6qrCuNUwkHDxRZzGqgfsf55tmGegZ_vxUhaL08T3k0MXnz2cM0hVOA/exec';

    var pathParts = location.pathname.split('/certificates/');
    var JLID = decodeURIComponent((pathParts[1] || '').replace(/\/$/, '')).trim().toUpperCase();

    function showState(id) {
      ['loadingState', 'certState', 'errorState'].forEach(function(s) {
        document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
      });
    }

    function esc(s) { return String(s || '').replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // Google Drive "view" links (…/file/d/{ID}/view) can be embedded inline
    // via the …/preview variant, and downloaded directly via uc?export=download
    // — both stay same-origin-feeling (no forced redirect away from the page).
    function driveFileId(url) {
      var m = String(url || '').match(/\/file\/d\/([^/]+)/);
      return m ? m[1] : '';
    }
    function drivePreviewUrl(url) {
      var id = driveFileId(url);
      return id ? 'https://drive.google.com/file/d/' + id + '/preview' : url;
    }
    function driveDownloadUrl(url) {
      var id = driveFileId(url);
      return id ? 'https://drive.google.com/uc?export=download&id=' + id : url;
    }

    function togglePreview(idx) {
      var el = document.getElementById('preview-' + idx);
      var btn = document.getElementById('viewbtn-' + idx);
      if (!el) return;
      var opening = el.style.display === 'none';
      el.style.display = opening ? 'block' : 'none';
      if (opening && !el.dataset.loaded) {
        el.innerHTML = '<iframe src="' + el.dataset.src + '" allow="autoplay"></iframe>';
        el.dataset.loaded = '1';
      }
      if (btn) btn.innerHTML = opening ? '<i class="fas fa-eye-slash"></i> Hide' : '<i class="fas fa-eye"></i> View';
    }

    // Lightweight confetti burst — no external library. Fires once when the
    // certificates finish loading; particles fall + rotate for ~2.6s then stop.
    function fireConfetti() {
      var canvas = document.getElementById('confettiCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      function resize() {
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();

      var colors = ['#7c3aed', '#ffc700', '#16a34a', '#f97316', '#0a66c2', '#ef4444'];
      var count = window.innerWidth < 480 ? 80 : 140;
      var particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * window.innerHeight * 0.4,
          w: 6 + Math.random() * 5,
          h: 8 + Math.random() * 6,
          color: colors[i % colors.length],
          vy: 2.2 + Math.random() * 2.6,
          vx: -1.2 + Math.random() * 2.4,
          rot: Math.random() * 360,
          vr: -8 + Math.random() * 16
        });
      }

      var start = Date.now();
      var duration = 2800;
      function frame() {
        var elapsed = Date.now() - start;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        var fade = elapsed > duration - 500 ? Math.max(0, (duration - elapsed) / 500) : 1;
        particles.forEach(function(p) {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }
      requestAnimationFrame(frame);
    }

    function copyLink(idx, url) {
      navigator.clipboard.writeText(url).then(function() {
        var t = document.getElementById('copytoast-' + idx);
        if (t) { t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 1800); }
      });
    }

    (function() {
      if (!JLID) {
        document.getElementById('errorMsg').textContent = 'This link is missing learner information. Please contact JetLearn support.';
        showState('errorState');
        return;
      }
      fetch(GAS_URL + '?api=myCertificates&jlid=' + encodeURIComponent(JLID))
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (!res || !res.success || !res.certificates || !res.certificates.length) {
            document.getElementById('errorMsg').textContent = (res && res.message) || 'No certificates found for this link.';
            showState('errorState');
            return;
          }
          var first = (res.learnerName || '').split(' ')[0] || 'there';
          var n = res.certificates.length;
          document.getElementById('heroTitle').textContent = first + '’s Achievement Wall';
          document.getElementById('heroSub').textContent = 'Every certificate ' + first + ' has earned at JetLearn — proud of every milestone!';

          var years = {};
          res.certificates.forEach(function(c) { if (c.year) years[c.year] = true; });
          document.getElementById('statRow').innerHTML =
              '<div class="stat-pill"><b>' + n + '</b><span>Certificate' + (n > 1 ? 's' : '') + '</span></div>'
            + '<div class="stat-pill"><b>' + Object.keys(years).length + '</b><span>Year' + (Object.keys(years).length > 1 ? 's' : '') + '</span></div>'
            + '<div class="stat-pill"><b>&#127775;</b><span>Star Learner</span></div>';

          var html = res.certificates.map(function(c, idx) {
            var hasFile = !!c.driveUrl;
            var previewUrl = hasFile ? drivePreviewUrl(c.driveUrl) : '';
            var downloadUrl = hasFile ? driveDownloadUrl(c.driveUrl) : '';

            var postText = 'I’m glad to inform that I’ve completed my certification in "' + c.course + '" with JetLearn! 🎉🚀 #JetLearn #STEM #Coding #LearningJourney';
            var shareUrl = c.driveUrl || ('https://jetlearn-kit-links.web.app/certificates/' + encodeURIComponent(res.jlid));

            var actions = hasFile
              ? '<div class="cert-actions">'
                + '<button class="btn-sm btn-view" id="viewbtn-' + idx + '" onclick="togglePreview(' + idx + ')"><i class="fas fa-eye"></i> View</button>'
                + '<a class="btn-sm btn-download" href="' + esc(downloadUrl) + '" target="_blank"><i class="fas fa-download"></i> Download</a>'
                + '</div>'
              : '';

            var preview = hasFile
              ? '<div class="cert-preview" id="preview-' + idx + '" data-src="' + esc(previewUrl) + '" style="display:none;"></div>'
              : '';

            var shareRow = '<div class="share-row">'
              + '<span class="share-label">Share:</span>'
              + '<a class="share-btn share-linkedin" title="Share on LinkedIn" target="_blank" href="https://www.linkedin.com/shareArticle?mini=true&url=' + encodeURIComponent(shareUrl) + '&title=' + encodeURIComponent('Certificate: ' + c.course) + '&summary=' + encodeURIComponent(postText) + '"><i class="fab fa-linkedin-in"></i></a>'
              + '<a class="share-btn share-whatsapp" title="Share on WhatsApp" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(postText + ' ' + shareUrl) + '"><i class="fab fa-whatsapp"></i></a>'
              + '<a class="share-btn share-x" title="Share on X" target="_blank" href="https://twitter.com/intent/tweet?text=' + encodeURIComponent(postText) + '&url=' + encodeURIComponent(shareUrl) + '"><i class="fab fa-x-twitter"></i></a>'
              + '<a class="share-btn share-facebook" title="Share on Facebook" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '"><i class="fab fa-facebook-f"></i></a>'
              + '<button class="share-btn share-copy" title="Copy link" onclick="copyLink(' + idx + ',\'' + shareUrl.replace(/'/g, "\\'") + '\')"><i class="fas fa-link"></i></button>'
              + '<span class="copy-toast" id="copytoast-' + idx + '">Copied!</span>'
              + '</div>';

            return '<div class="cert-card reveal" style="animation-delay:' + (0.3 + idx * 0.1).toFixed(2) + 's;">'
              + '<div class="cert-accent"></div>'
              + '<div class="cert-card-inner">'
              + '<div class="cert-top">'
              + '<div class="cert-icon"><i class="fas fa-award"></i></div>'
              + '<div class="cert-info"><span class="badge">Completed</span><b>' + esc(c.course) + '</b><span>' + esc(c.timestamp || c.year) + '</span></div>'
              + '</div>'
              + actions
              + preview
              + shareRow
              + '</div>'
              + '</div>';
          }).join('');
          document.getElementById('certList').innerHTML = html;

          showState('certState');
          fireConfetti();
        })
        .catch(function(err) {
          document.getElementById('errorMsg').textContent = String((err && err.message) || err);
          showState('errorState');
        });
    })();
  </script>
</body>
</html>
